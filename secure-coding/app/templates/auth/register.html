{% extends "base.html" %}
{% block title %}회원가입{% endblock %}
{% block content %}
  <h1>회원가입</h1>
  <form method="post" action="{{ url_for('auth.register') }}" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>아이디
      <input name="username" value="{{ username or '' }}" required
             minlength="3" maxlength="20" autocomplete="username">
    </label>
    <label>계정명
      <input name="display_name" value="{{ display_name or '' }}" required maxlength="30">
    </label>
    <label>비밀번호
      <input type="password" name="password" required minlength="8" autocomplete="new-password">
    </label>
    <label>비밀번호 확인
      <input type="password" name="password_confirm" required minlength="8" autocomplete="new-password">
    </label>
    <button type="submit">가입하기</button>
  </form>
  <p class="muted">이미 계정이 있으신가요? <a href="{{ url_for('auth.login') }}">로그인</a></p>
{% endblock %}
